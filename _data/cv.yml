cv:
  name: Sherif Gerges
  label: Analytic and Translational Genetics Unit, Massachusetts General Hospital, Richard B. Simches Research Center, 185 Cambridge Street, Boston, MA 02114
  email: sherif_gerges@g.harvard.edu

  sections:

    Summary:
      - bullet: I am a postdoctoral researcher at the Broad Institute of MIT and Harvard, working with Hilary Finucane, Mark Daly and Steve McCarroll. I develop quantitative methods for using genetics to glean mechanistic insights into neuropsychiatric and neurodevelopmental disorders, combining statistical genetics, functional genomics and computational structural biology. Link to <a href="https://scholar.google.com/citations?user=RPi2kgoAAAAJ"><i class="ai ai-google-scholar"></i> Google Scholar</a>

    Education:
      - institution: Harvard Medical School
        area: Genetics and Genomics
        degree: PhD
        start_date: 2017
        end_date: 2025
        highlights:
          - "Advisors: Drs. Mark Daly & Steve McCarroll"
      - institution: Montclair State University
        area: Molecular Biology; minors in Computer Science & Mathematics (Magna Cum Laude)
        degree: BS
        start_date: 2010
        end_date: 2013

    Experience:
      - company: Broad Institute of MIT and Harvard
        position: Postdoctoral Researcher
        start_date: 2025
        end_date: present
        highlights:
          - "Advisors: Hilary Finucane, Mark Daly & Steve McCarroll"
          - Developing structure-based statistical methods for interpreting rare missense variation in neuropsychiatric disease
          - Lead a multi-institutional collaboration pairing CRISPR cellular models with biochemical assays to test variants from schizophrenia and ASD exome studies

      - company: Acurasset Therapeutics
        position: Co-founder
        start_date: 2022
        end_date: present
        highlights:
          - Co-founded with Prof. Alexander Ploss (Princeton University) to identify small-molecule inhibitors of an unexploited step in the HBV lifecycle
          - Lead fundraising and operations; raised over $500,000 in venture capital and non-dilutive grants

      - company: Third Rock Ventures
        position: Computational Consultant
        start_date: 2020
        end_date: 2021
        highlights:
          - Lead computational consultant for the founding team of Asher Bio.
          - Built pipelines identifying cell-surface markers from single-cell RNA-seq; contributed to AB248, an engineered IL-2 immunotherapy

      - company: Princeton University
        position: Research Assistant
