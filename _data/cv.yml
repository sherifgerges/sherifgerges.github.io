- title: Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: Broad Institute of MIT and Harvard
      year: 2025–present
      description:
        - Labs of Mark Daly and Steve McCarroll
        - Developing structure-based statistical methods for interpreting rare missense variation in neuropsychiatric disease, validated with cryo-EM

    - title: Ph.D. Student
      institution: Harvard Medical School
      year: 2017–2025
      description:
        - Thesis advisors: Mark Daly and Steve McCarroll
        - Developed a multi-omic strategy integrating large-scale single-cell transcriptomics, proteomics, and human genetics to uncover genes and pathways implicated in neuropsychiatric disorders, with emphasis on schizophrenia and autism spectrum disorders
        - Developed a statistical method that leverages AlphaFold3-predicted protein structures to reveal non-random mutation clustering and infer disease mechanisms at the domain level, demonstrating a powerful predictor of missense variant effects and an orthogonal tool for variant prioritization (manuscript in preparation)
        - Initiated and led a multi-institutional collaboration co-designing CRISPR-based cellular models and protein-based biochemical assays to test missense variants from exome studies of schizophrenia and ASD, coordinating the labs of Mark Daly, Steve McCarroll, and Hilary Finucane (Broad Institute), Poul Nissen (Aarhus University), and Jonathan Weissman (MIT)
        - Collaborated on a high-throughput droplet-based barcoding strategy recording RNA co-occurrence across thousands of individual synapses, revealing transcriptomic compartments that organize synaptic biology and are enriched for neuropsychiatric genetic signal (manuscript in preparation)
        - Collaborated on integrative genetic analyses demonstrating that variation in cis-regulatory sequences of granulocytes and monocytes accounts for a substantial proportion of tuberculosis heritability
        - Collaborated with the Autism Sequencing Consortium on single-cell transcriptomic expression patterns of newly identified ASD genes and variant prioritization

    - title: Co-founder
      institution: Acurasset Therapeutics
      year: 2022–present
      description:
        - Co-founded with Professor Alexander Ploss, using advanced HBV infection models to identify small-molecule inhibitors of a previously unexploited step in the viral lifecycle
        - Hired a cross-functional team, including a contract research organization and a medicinal chemist from Harvard's Therapeutics Initiative, to advance the chemical development program
        - Lead all fundraising and operations; raised over $500,000 in venture capital and non-dilutive grants

    - title: Computational Consultant
      institution: Third Rock Ventures
      year: 2020–2021
      description:
        - Lead computational consultant for the founding team of an early-stage venture in immuno-oncology and neuroimmune disease (now Asher Bio)
        - Built a statistical pipeline processing large transcriptomic datasets to identify highly specific single-cell RNA-seq cell-surface markers across indications
        - Work contributed to Asher's lead program, AB248, an engineered IL-2 immunotherapy selectively targeting CD8+ effector T cells

    - title: Research Assistant
      institution: Princeton University — lab of Alexander Ploss
      year: 2014–2016
      description:
        - Molecular cloning, cell culture, and viral production to engineer hepatitis B, C, and D virus strains capable of infecting humanized mouse models

    - title: Research Assistant
      institution: California Institute of Technology — lab of Kai Zinn
      year: 2012–2014
      description:
        - Co-developed a stochastic block model simulating the evolution of modular biological networks, applied to yeast proteomics, mouse brain connectivity, and the C. elegans connectome
        - Modeled a 94-protein fat-regulation network in yeast, showing small-world (Watts–Strogatz) topology and modular organization supported by genetic and pharmacological validation

