- title: Summary
  type: list
  contents:
    - Human geneticist working at the intersection of statistical genetics, single-cell genomics, and protein structure. My research integrates large-scale genetics with structural modeling to uncover mechanisms driving neuropsychiatric disorders, with a focus on using genetics to discover novel biology for drug discovery.

